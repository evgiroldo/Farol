name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  farolcore:
    name: FarolCore — build, test, format, no network
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        working-directory: FarolCore
        run: swift build --build-tests

      - name: Test
        working-directory: FarolCore
        run: swift test --skip-build

      - name: Check formatting
        run: xcrun swift-format lint --strict -r FarolCore/Sources FarolCore/Tests

      - name: Check there is no networking code (ADR 0009)
        run: scripts/check-no-network.sh
